<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="panel.css">
</head>
<body>
<div id="main">
  <div class="brand"><img src="assets/logo.webp" alt="SeyedCutter logo"><h2>SeyedCutter</h2></div>
  <p class="sub">CSV cutter, Cut and Select - cut only, paint RED, nothing removed.</p>
  <label>1. Choose CSV (start_seconds,end_seconds,start_tc,end_tc,label)</label><br>
  <input id="csvFile" type="file" accept=".csv,text/csv"><br>
  <div class="row">
    <button id="btnPreview">Preview</button>
  </div>
  <div id="list"></div>
  <button id="btnCut" class="primary">Cut sequence (Ctrl+Shift+K) + Paint RED</button>
  <div id="status">Ready. Open a sequence in Premiere first.</div>
  <details><summary>CSV format</summary>
  <code>start_seconds,end_seconds,start_tc,end_tc,label<br>62,65,00:01:02,00:01:05,Opening</code>
  </details>
</div>
<script src="js/CSInterface.js"></script>
<script src="js/main.js"></script>
</body>
</html>
